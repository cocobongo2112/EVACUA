name: EVACUA CI y Agente de Calidad

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Simular un fallo para comprobar la notificación de Discord'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test-and-analyze:
    name: Pipeline API con diagnóstico visual
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el repositorio
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: 3. Instalar dependencias del API
        id: install
        working-directory: api
        run: npm ci

      - name: 4. Ejecutar pruebas AAA y cobertura
        id: api_tests
        continue-on-error: true
        working-directory: api
        run: |
          mkdir -p reports
          npm run test:ci

      - name: 5. Analizar código y Quality Gate
        id: sonar
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          projectBaseDir: api
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: 6. Ejecutar agente inteligente EVACUA
        id: quality_agent
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TEST_OUTCOME: ${{ steps.api_tests.outcome }}
          SONAR_OUTCOME: ${{ steps.sonar.outcome }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.head_ref || github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: node ci/evacua-quality-agent.cjs

      - name: 7. Publicar resumen gráfico en GitHub
        if: always() && hashFiles('reports/quality-agent/summary.md') != ''
        run: cat reports/quality-agent/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 8. Comentar diagnóstico en el Pull Request
        if: always() && github.event_name == 'pull_request' && hashFiles('reports/quality-agent/pr-comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- EVACUA_QUALITY_AGENT -->';
            const body = fs.readFileSync('reports/quality-agent/pr-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: 9. Guardar tablero visual como evidencia
        if: always() && hashFiles('reports/quality-agent/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: EVACUA-Quality-Agent-${{ github.run_number }}
          path: reports/quality-agent/
          retention-days: 30

      - name: 10. Aplicar decisión del Quality Gate
        if: always() && hashFiles('reports/quality-agent/report.json') != ''
        env:
          SIMULATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure || false }}
        run: |
          node ci/evacua-quality-agent.cjs --enforce reports/quality-agent/report.json
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            echo "Fallo controlado solicitado para demostrar la notificación."
            exit 1
          fi

      - name: 11. Notificar fallo en Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No existe el secreto DISCORD_WEBHOOK_URL."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          payload = {
              "username": "EVACUA CI Bot",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": "❌ Falló el Pipeline CI de EVACUA",
                  "description": (
                      "El agente de calidad detectó un fallo o una condición "
                      "que impide aprobar la integración."
                  ),
                  "url": os.environ["RUN_URL"],
                  "color": 14495300,
                  "fields": [
                      {
                          "name": "Repositorio",
                          "value": os.environ["REPOSITORY"],
                          "inline": True,
                      },
                      {
                          "name": "Rama",
                          "value": os.environ["BRANCH"],
                          "inline": True,
                      },
                      {
                          "name": "Workflow",
                          "value": os.environ["WORKFLOW_NAME"],
                          "inline": False,
                      },
                      {
                          "name": "Commit",
                          "value": os.environ["COMMIT_SHA"][:7],
                          "inline": True,
                      },
                      {
                          "name": "Ejecutado por",
                          "value": os.environ["ACTOR"],
                          "inline": True,
                      },
                      {
                          "name": "Evento",
                          "value": os.environ["EVENT_NAME"],
                          "inline": True,
                      },
                  ],
                  "footer": {
                      "text": "Abrir la ejecución para consultar el diagnóstico del agente"
                  },
                  "timestamp": datetime.now(timezone.utc).isoformat(),
              }],
          }

          with open("discord-payload.json", "w", encoding="utf-8") as file:
              json.dump(payload, file, ensure_ascii=False)
          PY

          curl --fail-with-body --retry 2 \
            -H "Content-Type: application/json" \
            --data @discord-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true"
